# Labels added to pull requests from the files they change (actions/labeler).

protected-pricing:
  - changed-files:
      - any-glob-to-any-file:
          - CLAUDE.md
          - src/utils/paymentCalculations.js
          - src/services/disposalService.js
          - src/services/paymentService.js
          - src/utils/__tests__/promotionalPayout.test.js

payments:
  - changed-files:
      - any-glob-to-any-file:
          - supabase/functions/trendipay-*/**
          - src/services/trendiPayService.js
          - src/services/earningsService.js

database:
  - changed-files:
      - any-glob-to-any-file:
          - supabase/migrations/**
          - supabase/diagnostics/**

product:carter:
  - changed-files:
      - any-glob-to-any-file:
          - src/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/ci/**
          - .gitleaks.toml
          - eslint.config.js

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
