name: Release notes

# After every push to main, record a GitHub Release listing the pull requests
# it shipped. Netlify deploys every push to main on its own, whatever CI says,
# so this runs whatever CI concluded and flags a failed run at the top: the deploy log for
# traceability and the "what changed" list for Operations.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-notes.cjs`);
            await run({ github, context, core }, {
              sha: context.payload.workflow_run.head_sha,
              runUrl: context.payload.workflow_run.html_url,
              ciConclusion: context.payload.workflow_run.conclusion,
            });
