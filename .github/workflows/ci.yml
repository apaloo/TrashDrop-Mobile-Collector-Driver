name: CI

# Every pull request: lint the whole app, run the unit tests, build.
# Netlify builds and deploys the site itself; this workflow only checks.
# Process: engineering/policies/change-and-release.md in TrashDrop-Mobile-User-Domestic.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci

      # The whole app must be lint-clean: the backlog reached 0 errors on
      # 2026-11-12 (TD26). Warnings are reported, not enforced.
      - name: Lint
        run: npx eslint . --quiet

      # Every package the app imports is a runtime dependency, so the
      # dependency audit (npm audit --omit=dev) covers it and no update can
      # remove it from under the build.
      - name: Runtime dependency check
        run: |
          node scripts/ci/check-runtime-deps.cjs --self-test
          node scripts/ci/check-runtime-deps.cjs src

      # Only TrashDrop domains we own (trashdrops.com) in shipped code:
      # trashdrop.app is someone else's (TD58, household repository)
      - name: Owned domains check
        run: |
          node scripts/ci/check-domains.cjs --self-test
          node scripts/ci/check-domains.cjs src supabase/functions index.html

      # Every supabase.rpc() call must name a database function that exists,
      # with parameter names it takes (production snapshot plus this
      # repository's migrations). Unit tests mock the database, so they can't.
      - name: Database call check
        run: |
          node scripts/ci/check-rpc-calls.mjs --self-test
          node scripts/ci/check-rpc-calls.mjs

      # Every Jest suite except scripts/ci/known-failing-tests.txt (may only
      # shrink). Includes the protected promotionalPayout guard test.
      - name: Unit tests
        run: node scripts/ci/run-tests.mjs

      # Report only: the whole app and each file in scripts/ci/critical-files.txt
      - name: Test coverage (report)
        if: always()
        run: node scripts/ci/coverage-summary.mjs

      - name: Build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npm run build
