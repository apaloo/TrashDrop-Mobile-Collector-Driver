# gitleaks configuration: the default rules, plus a few known-safe paths.
# Adding an allowlist entry needs the Technical Lead's review (CODEOWNERS).
title = "TrashDrop secret scanning"

[extend]
useDefault = true

# gitleaks' own Facebook rule only knows app tokens. Meta user, page and
# WhatsApp access tokens start with EAA; the boundaries keep base64 image data
# from matching. Same rule as the household repository (2026-11-12).
[[rules]]
id = "meta-access-token"
description = "Meta (Facebook, Instagram, WhatsApp) access token"
regex = '''(?:^|[^A-Za-z0-9+/])(EAA[A-Za-z0-9]{90,})(?:[^A-Za-z0-9+/=]|$)'''
secretGroup = 1
entropy = 4.0
keywords = ["eaa"]

[allowlist]
description = "Known-safe files"
paths = [
  # Self-signed certificates for local HTTPS development only
  # (regenerate with generate-cert.js). Tracked as tech debt for removal.
  '''(^|/)localhost(-key)?\.pem$''',
  # Lockfiles contain integrity hashes, not secrets.
  '''(^|/)package-lock\.json$''',
  # Example env files contain placeholders only.
  '''(^|/)\.env[^/]*\.example$''',
  '''(^|/)node_modules/''',
]
