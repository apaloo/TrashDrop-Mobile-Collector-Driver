[functions.trendipay-disbursement]
verify_jwt = false

[functions.trendipay-proxy]
verify_jwt = false

[functions.trendipay-webhook]
# Called by TrendiPay, which sends no Supabase token; the function checks
# the x-trendipay-signature HMAC itself
